<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawCore Paint</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg), #020617);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      padding: 20px;
      border-right: 1px solid var(--border);
      background: rgba(17,24,39,0.9);
      backdrop-filter: blur(10px);
    }
    .sidebar h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .sidebar p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }
    .group {
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(31,41,55,0.65);
    }
    .group h2 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .row:last-child { margin-bottom: 0; }
    label {
      font-size: 14px;
      color: var(--text);
    }
    button, select, input[type="range"] {
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    button {
      cursor: pointer;
      padding: 10px 12px;
      background: var(--panel-2);
      color: var(--text);
      transition: 0.15s ease;
    }
    button:hover { transform: translateY(-1px); border-color: #475569; }
    button.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(34,197,94,0.4) inset;
    }
    input[type="color"] {
      width: 56px;
      height: 40px;
      border: 0;
      background: transparent;
      padding: 0;
    }
    input[type="range"] {
      width: 100%;
    }
    .canvas-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .stage {
      width: min(100%, 1100px);
      height: min(82vh, 820px);
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--border); }
      .stage { height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>🎨 ClawCore Paint</h1>
      <p>브러시, 지우개, 색상, 두께 조절, PNG 저장까지 되는 간단한 그림판 MVP야.</p>

      <section class="group">
        <h2>도구</h2>
        <div class="row">
          <button id="brushBtn" class="active">브러시</button>
          <button id="eraserBtn">지우개</button>
        </div>
      </section>

      <section class="group">
        <h2>브러시 설정</h2>
        <div class="row">
          <label for="colorPicker">색상</label>
          <input id="colorPicker" type="color" value="#111111" />
        </div>
        <div class="row">
          <label for="sizeRange">크기: <span id="sizeValue">8</span>px</label>
          <input id="sizeRange" type="range" min="1" max="60" value="8" />
        </div>
      </section>

      <section class="group">
        <h2>캔버스</h2>
        <div class="row">
          <button id="clearBtn">전체 지우기</button>
          <button id="saveBtn">PNG 저장</button>
        </div>
      </section>

      <section class="group">
        <h2>캔버스 배경</h2>
        <div class="row">
          <button data-bg="#ffffff" class="bg-btn active">흰색</button>
          <button data-bg="#fef3c7" class="bg-btn">아이보리</button>
          <button data-bg="#e0f2fe" class="bg-btn">하늘</button>
        </div>
      </section>

      <div class="status">
        현재 도구: <strong id="toolLabel">브러시</strong><br />
        배경색: <strong id="bgLabel">#ffffff</strong>
      </div>
      <p class="hint">팁: 마우스로 그리거나 트랙패드/터치로도 바로 쓸 수 있어.</p>
    </aside>

    <main class="canvas-wrap">
      <div class="stage">
        <canvas id="paintCanvas"></canvas>
      </div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    const brushBtn = document.getElementById('brushBtn');
    const eraserBtn = document.getElementById('eraserBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const colorPicker = document.getElementById('colorPicker');
    const sizeRange = document.getElementById('sizeRange');
    const sizeValue = document.getElementById('sizeValue');
    const toolLabel = document.getElementById('toolLabel');
    const bgLabel = document.getElementById('bgLabel');
    const bgButtons = document.querySelectorAll('.bg-btn');

    let drawing = false;
    let tool = 'brush';
    let backgroundColor = '#ffffff';

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const snapshot = canvas.toDataURL();
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      fillBackground(backgroundColor);
      if (snapshot !== 'data:,') {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = snapshot;
      }
      configureBrush();
    }

    function fillBackground(color) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function configureBrush() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Number(sizeRange.value);
      if (tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = colorPicker.value;
      }
      toolLabel.textContent = tool === 'eraser' ? '지우개' : '브러시';
      sizeValue.textContent = sizeRange.value;
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      configureBrush();
      const { x, y } = pointerPos(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!drawing) return;
      const { x, y } = pointerPos(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function endDraw() {
      if (!drawing) return;
      drawing = false;
      ctx.closePath();
    }

    brushBtn.addEventListener('click', () => {
      tool = 'brush';
      brushBtn.classList.add('active');
      eraserBtn.classList.remove('active');
      configureBrush();
    });

    eraserBtn.addEventListener('click', () => {
      tool = 'eraser';
      eraserBtn.classList.add('active');
      brushBtn.classList.remove('active');
      configureBrush();
    });

    sizeRange.addEventListener('input', configureBrush);
    colorPicker.addEventListener('input', configureBrush);

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fillBackground(backgroundColor);
    });

    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `clawcore-paint-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    bgButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        bgButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        backgroundColor = btn.dataset.bg;
        bgLabel.textContent = backgroundColor;
        const snapshot = canvas.toDataURL();
        const img = new Image();
        img.onload = () => {
          fillBackground(backgroundColor);
          ctx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight);
        };
        img.src = snapshot;
      });
    });

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointerleave', endDraw);

    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();
    bgLabel.textContent = backgroundColor;
    configureBrush();
  </script>
</body>
</html>
